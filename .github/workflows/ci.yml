name: CI

on:
  pull_request:
    branches:
      - develop
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Angular portal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build