services:
  appointments-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # Composed release served to dlc-front (APPOINTMENTS_UPSTREAM=http://appointments-portal-dlc-front).
  appointments-portal-dlc-front:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BUILD_SCRIPT: build:entry
    container_name: appointments-portal-dlc-front
    ports:
      - "4177:80"
    networks:
      - dlc-front
    restart: unless-stopped

networks:
  dlc-front:
    name: dlc-front
